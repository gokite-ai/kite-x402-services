schema: 1
name: kite-python-weather
display_name: Python FastAPI Weather (python-fastapi template)
description: >-
  Example service built from the python-fastapi template. Proxies the Open-Meteo
  weather API with x402 pay-per-call pricing on the Kite testnet (pieUSD).
maintainer:
  github: qiaopengjun5162
status: draft
network: eip155:2368
pay_to: "0x0000000000000000000000000000000000000000"
upstream:
  name: Open-Meteo
  url: https://open-meteo.com
  requires_api_key: false
  terms_url: https://open-meteo.com/en/terms
source: custom
endpoints:
  - method: GET
    path: /v1/forecast
    summary: Weather forecast for a coordinate; proxies Open-Meteo /v1/forecast.
    price_usd: "0.001"
    example_request:
      query:
        latitude: 52.52
        longitude: 13.41
        current: temperature_2m,wind_speed_10m
        hourly: temperature_2m
        forecast_days: 1
    pitfalls:
      - "latitude and longitude are required; Open-Meteo returns 400 without both"
      - "unknown variable names return 400 (see https://open-meteo.com/en/docs)"
categories: [weather, data]
tags: [weather, forecast, open-meteo, python, fastapi]
